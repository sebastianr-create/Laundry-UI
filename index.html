<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olala Laundry 2026 - Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1a202c;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            color: #667eea;
            font-weight: 700;
        }

        .filters-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select,
        .filter-group input {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: white;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .data-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .data-section h2 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            color: #2d3748;
        }

        .items-grid {
            display: grid;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .items-grid::-webkit-scrollbar {
            width: 8px;
        }

        .items-grid::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .items-grid::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 12px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .item-row:hover {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e0 100%);
            border-left-color: #667eea;
            transform: translateX(5px);
        }

        .item-name {
            font-weight: 600;
            color: #2d3748;
            font-size: 1.05rem;
        }

        .item-qty {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 80px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 1.5rem;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 4px solid #c53030;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: #718096;
            font-size: 1.2rem;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [data, setData] = useState([]);
            const [filteredData, setFilteredData] = useState([]);
            
            // Filters
            const [cities, setCities] = useState([]);
            const [buildings, setBuildings] = useState([]);
            const [selectedCity, setSelectedCity] = useState('all');
            const [selectedBuilding, setSelectedBuilding] = useState('all');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            // Stats
            const [stats, setStats] = useState({
                totalItems: 0,
                totalQuantity: 0,
                avgQuantity: 0
            });

            useEffect(() => {
                loadData();
            }, []);

            useEffect(() => {
                applyFilters();
            }, [selectedCity, selectedBuilding, startDate, endDate, data]);

            async function loadData() {
                try {
                    setLoading(true);
                    setError(null);
                    
                    // Call backend API
                    const response = await fetch('/api/laundry-data');
                    
                    if (!response.ok) {
                        throw new Error('Error al cargar datos. Verifica que el backend esté corriendo.');
                    }
                    
                    const result = await response.json();
                    
                    setData(result.data || []);
                    setCities([...new Set(result.data.map(item => item.ciudad))].sort());
                    setBuildings([...new Set(result.data.map(item => item.building))].sort());
                    
                } catch (err) {
                    setError(err.message);
                    // Mock data for demo
                    const mockData = generateMockData();
                    setData(mockData);
                    setCities(['Barcelona', 'Madrid', 'Sur', 'Granada']);
                    setBuildings(['Urban', 'Design', 'Forum', 'Casanova', 'Valencia']);
                } finally {
                    setLoading(false);
                }
            }

            function generateMockData() {
                const items = ['Alfombrín', 'Funda', 'Nórdico Individual', 'Nórdico Matrimonio', 
                              'Nórdico Imperial', 'Paños de Cocina', 'Sábana Imperial', 
                              'Sábana Matrimonio', 'Sábana Individual', 'Toalla Baño', 'Toalla Mano'];
                const cities = ['Barcelona', 'Madrid', 'Sur', 'Granada'];
                const buildings = ['Urban', 'Design', 'Forum', 'Casanova', 'Valencia'];
                
                const mockData = [];
                cities.forEach(city => {
                    buildings.forEach(building => {
                        items.forEach(item => {
                            mockData.push({
                                item: item,
                                qty: Math.floor(Math.random() * 500) + 50,
                                ciudad: city,
                                building: building,
                                fecha: new Date(2026, 0, Math.floor(Math.random() * 27) + 1).toISOString().split('T')[0]
                            });
                        });
                    });
                });
                return mockData;
            }

            function applyFilters() {
                let filtered = [...data];

                if (selectedCity !== 'all') {
                    filtered = filtered.filter(item => item.ciudad === selectedCity);
                }

                if (selectedBuilding !== 'all') {
                    filtered = filtered.filter(item => item.building === selectedBuilding);
                }

                if (startDate) {
                    filtered = filtered.filter(item => item.fecha >= startDate);
                }

                if (endDate) {
                    filtered = filtered.filter(item => item.fecha <= endDate);
                }

                // Consolidate by item
                const consolidated = {};
                filtered.forEach(item => {
                    if (!consolidated[item.item]) {
                        consolidated[item.item] = 0;
                    }
                    consolidated[item.item] += item.qty;
                });

                const result = Object.entries(consolidated)
                    .map(([item, qty]) => ({ item, qty }))
                    .sort((a, b) => b.qty - a.qty);

                setFilteredData(result);

                // Calculate stats
                const totalQty = result.reduce((sum, item) => sum + item.qty, 0);
                setStats({
                    totalItems: result.length,
                    totalQuantity: totalQty,
                    avgQuantity: result.length > 0 ? Math.round(totalQty / result.length) : 0
                });
            }

            if (loading) {
                return (
                    <div className="container">
                        <div className="loading">
                            <div>🧺 Cargando datos de lavandería...</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>Olala Laundry Dashboard</h1>
                        <div className="logo">OLALA HOMES</div>
                    </div>

                    {error && (
                        <div className="error">
                            ⚠️ {error}
                            <br /><small>Mostrando datos de demostración. Configura el backend para datos reales.</small>
                        </div>
                    )}

                    <div className="filters-section">
                        <div className="filters-grid">
                            <div className="filter-group">
                                <label>Ciudad</label>
                                <select value={selectedCity} onChange={(e) => setSelectedCity(e.target.value)}>
                                    <option value="all">Todas las ciudades</option>
                                    {cities.map(city => (
                                        <option key={city} value={city}>{city}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="filter-group">
                                <label>Building</label>
                                <select value={selectedBuilding} onChange={(e) => setSelectedBuilding(e.target.value)}>
                                    <option value="all">Todos los buildings</option>
                                    {buildings.map(building => (
                                        <option key={building} value={building}>{building}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="filter-group">
                                <label>Fecha inicio</label>
                                <input 
                                    type="date" 
                                    value={startDate} 
                                    onChange={(e) => setStartDate(e.target.value)}
                                />
                            </div>

                            <div className="filter-group">
                                <label>Fecha fin</label>
                                <input 
                                    type="date" 
                                    value={endDate} 
                                    onChange={(e) => setEndDate(e.target.value)}
                                />
                            </div>
                        </div>
                    </div>

                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-label">Total Items</div>
                            <div className="stat-value">{stats.totalItems}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Cantidad Total</div>
                            <div className="stat-value">{stats.totalQuantity.toLocaleString()}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Promedio por Item</div>
                            <div className="stat-value">{stats.avgQuantity}</div>
                        </div>
                        <div className="stat-card" style={{display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                            <button className="refresh-btn" onClick={loadData}>
                                🔄 Refrescar
                            </button>
                        </div>
                    </div>

                    <div className="data-section">
                        <h2>Pedido Consolidado de Reposición</h2>
                        {filteredData.length > 0 ? (
                            <div className="items-grid">
                                {filteredData.map((item, index) => (
                                    <div key={index} className="item-row">
                                        <div className="item-name">{item.item}</div>
                                        <div className="item-qty">{item.qty}</div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="no-data">
                                No hay datos para los filtros seleccionados
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
